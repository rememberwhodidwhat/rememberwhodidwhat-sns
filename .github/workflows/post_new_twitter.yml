name: Post new events to Twitter

on:
  push:
    branches: [main]
    paths: [events.json]

jobs:
  post:
    runs-on: ubuntu-latest
    # ブランチ新規作成時（before が 0000...）は比較元がないため投稿しない
    if: github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Post new events
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: uv run post_twitter.py new ${{ github.event.before }}
